<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cash Curve - Personal Finance Tracker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'tracker/css/style.css' %}">
</head>
<body>
    {% if user.is_authenticated %}
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div id="sidebar-wrapper">
            <div class="sidebar-brand">
                <h3><i class="fas fa-chart-line"></i> Cash Curve</h3>
            </div>
            <ul class="sidebar-nav">
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"
                       href="{% url 'tracker:dashboard' %}">
                        <i class="fas fa-home"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'add_transaction' %}active{% endif %}"
                       href="{% url 'tracker:add_transaction' %}">
                        <i class="fas fa-plus-circle"></i> Add Transaction
                    </a>
                </li>
                <li class="nav-item mt-5">
                    <div class="nav-user-info">
                        <i class="fas fa-user-circle"></i>
                        <span>{{ user.username }}</span>
                    </div>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'tracker:logout' %}">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                </li>
            </ul>
        </div>

        <!-- Page Content -->
        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
                <button class="btn" id="menu-toggle">
                    <i class="fas fa-bars"></i>
                </button>
            </nav>

            <div class="container-fluid">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
    {% else %}
    <!-- Auth pages (login/signup) -->
    <div class="auth-container">
        {% block auth_content %}{% endblock %}
    </div>
    {% endif %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        // Django Messages to SweetAlert2
        {% if messages %}
            document.addEventListener('DOMContentLoaded', function() {
                {% for message in messages %}
                    {% if message.tags == 'success' %}
                        Swal.fire({
                            icon: 'success',
                            title: 'Success!',
                            text: '{{ message }}',
                            timer: 3000,
                            timerProgressBar: true,
                            showConfirmButton: false,
                            toast: true,
                            position: 'top-end',
                            background: '#d4edda',
                            color: '#155724'
                        });
                    {% elif message.tags == 'error' %}
                        Swal.fire({
                            icon: 'error',
                            title: 'Error!',
                            text: '{{ message }}',
                            timer: 4000,
                            timerProgressBar: true,
                            showConfirmButton: false,
                            toast: true,
                            position: 'top-end',
                            background: '#f8d7da',
                            color: '#721c24'
                        });
                    {% elif message.tags == 'warning' %}
                        Swal.fire({
                            icon: 'warning',
                            title: 'Warning!',
                            text: '{{ message }}',
                            timer: 3500,
                            timerProgressBar: true,
                            showConfirmButton: false,
                            toast: true,
                            position: 'top-end',
                            background: '#fff3cd',
                            color: '#856404'
                        });
                    {% elif message.tags == 'info' %}
                        Swal.fire({
                            icon: 'info',
                            title: 'Info!',
                            text: '{{ message }}',
                            timer: 3000,
                            timerProgressBar: true,
                            showConfirmButton: false,
                            toast: true,
                            position: 'top-end',
                            background: '#d1ecf1',
                            color: '#0c5460'
                        });
                    {% endif %}
                {% endfor %}
            });
        {% endif %}
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
