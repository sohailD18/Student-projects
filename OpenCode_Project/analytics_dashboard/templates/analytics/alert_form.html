{% extends 'analytics/base.html' %}

{% block title %}Create Alert - Analytics Dashboard{% endblock %}

{% block content %}
<div class="container">
    <div class="form-container">
        <h1>Create Alert</h1>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="name">Alert Name:</label>
                <input type="text" name="name" id="name" required>
            </div>
            <div class="form-group">
                <label for="description">Description:</label>
                <textarea name="description" id="description" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label for="metric">Metric:</label>
                <select name="metric" id="metric" required>
                    {% for metric in metrics %}
                    <option value="{{ metric.id }}">{{ metric.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="condition_type">Condition:</label>
                <select name="condition_type" id="condition_type" required>
                    {% for value, label in condition_types %}
                    <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="threshold_value">Threshold Value:</label>
                <input type="number" name="threshold_value" id="threshold_value" step="0.01" required>
            </div>
            <div class="form-group">
                <label for="severity">Severity:</label>
                <select name="severity" id="severity" required>
                    {% for value, label in severity_levels %}
                    <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Create Alert</button>
                <a href="/alerts/" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
