{% extends 'analytics/base.html' %}

{% block title %}Create Metric - Analytics Dashboard{% endblock %}

{% block content %}
<div class="container">
    <div class="form-container">
        <h1>Create Metric</h1>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="name">Metric Name:</label>
                <input type="text" name="name" id="name" required>
            </div>
            <div class="form-group">
                <label for="description">Description:</label>
                <textarea name="description" id="description" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label for="metric_type">Metric Type:</label>
                <select name="metric_type" id="metric_type" required>
                    {% for value, label in metric_types %}
                    <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="unit">Unit:</label>
                <input type="text" name="unit" id="unit" placeholder="e.g., users, $, %">
            </div>
            <div class="form-group">
                <label for="aggregation_period">Aggregation Period:</label>
                <select name="aggregation_period" id="aggregation_period">
                    <option value="hourly">Hourly</option>
                    <option value="daily" selected>Daily</option>
                    <option value="weekly">Weekly</option>
                    <option value="monthly">Monthly</option>
                </select>
            </div>
            <div class="form-group">
                <label for="target_value">Target Value (optional):</label>
                <input type="number" name="target_value" id="target_value" step="0.01">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Create Metric</button>
                <a href="/metrics/" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
