{% extends 'analytics/base.html' %}

{% block title %}Create Dashboard - Analytics Dashboard{% endblock %}

{% block content %}
<div class="container">
    <div class="form-container">
        <h1>Create Dashboard</h1>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="name">Dashboard Name:</label>
                <input type="text" name="name" id="name" required>
            </div>
            <div class="form-group">
                <label for="description">Description:</label>
                <textarea name="description" id="description" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" name="is_public">
                    Make this dashboard public
                </label>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Create Dashboard</button>
                <a href="/dashboards/" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
