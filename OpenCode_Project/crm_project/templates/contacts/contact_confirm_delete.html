{% extends 'base.html' %}

{% block title %}Delete Contact - CRM System{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <h1 class="card-title">Delete Contact</h1>
        <hr>
        <p>Are you sure you want to delete <strong>{{ object.full_name }}</strong>?</p>
        <p class="text-muted">This action cannot be undone.</p>
        
        <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-between">
                <a href="{% url 'contact_detail' object.pk %}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-danger">
                    <i class="fas fa-trash"></i> Delete Contact
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
