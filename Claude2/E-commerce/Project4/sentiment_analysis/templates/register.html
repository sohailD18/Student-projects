<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - E-Commerce Sentiment Analysis</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <!-- Logo and Title -->
        <div class="auth-header">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                    <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                    <line x1="12" y1="22.08" x2="12" y2="12"></line>
                </svg>
            </div>
            <h1>Create Account</h1>
            <p>Join us today</p>
        </div>

        <!-- Register Form -->
        <div class="auth-card">
            <form method="post" class="auth-form" id="registerForm">
                {% csrf_token %}

                <!-- Messages -->
                {% if messages %}
                    <div class="messages">
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} alert-animate">
                                <span class="alert-icon">
                                    {% if message.tags == 'error' %}
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <circle cx="12" cy="12" r="10"></circle>
                                            <line x1="12" y1="8" x2="12" y2="12"></line>
                                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                                        </svg>
                                    {% else %}
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                            <polyline points="22 4 12 14.01 9 11.01"></polyline>
                                        </svg>
                                    {% endif %}
                                </span>
                                {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}

                <!-- Username Field -->
                <div class="form-group">
                    <div class="floating-label">
                        <input
                            type="text"
                            id="username"
                            name="username"
                            required
                            autocomplete="username"
                            minlength="3"
                            oninput="validateField(this)"
                        >
                        <label for="username">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            <span>Username</span>
                        </label>
                        <div class="field-border"></div>
                    </div>
                    <small class="form-hint">Minimum 3 characters</small>
                </div>

                <!-- Email Field -->
                <div class="form-group">
                    <div class="floating-label">
                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                            autocomplete="email"
                            oninput="validateField(this)"
                        >
                        <label for="email">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                            <span>Email Address</span>
                        </label>
                        <div class="field-border"></div>
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <div class="floating-label">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            autocomplete="new-password"
                            minlength="6"
                            oninput="validateField(this); checkPasswordStrength()"
                        >
                        <label for="password">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <span>Password</span>
                        </label>
                        <button type="button" class="toggle-password" onclick="togglePassword('password')">
                            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-closed" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                        <div class="field-border"></div>
                    </div>
                    <!-- Password Strength Indicator -->
                    <div class="password-strength">
                        <div class="strength-bar">
                            <div class="strength-fill" id="strengthFill"></div>
                        </div>
                        <div class="strength-info">
                            <span class="strength-text" id="strengthText">Password strength</span>
                            <span class="strength-icon" id="strengthIcon"></span>
                        </div>
                    </div>
                </div>

                <!-- Confirm Password Field -->
                <div class="form-group">
                    <div class="floating-label">
                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            required
                            autocomplete="new-password"
                            oninput="validateField(this); checkPasswordMatch()"
                        >
                        <label for="confirm_password">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <span>Confirm Password</span>
                        </label>
                        <button type="button" class="toggle-password" onclick="togglePassword('confirm_password')">
                            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-closed" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                        <div class="field-border"></div>
                    </div>
                    <small class="form-hint" id="matchHint"></small>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-block btn-large" id="submitBtn">
                    <span class="btn-text">Create Account</span>
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="8.5" cy="7" r="4"></circle>
                        <line x1="20" y1="8" x2="20" y2="14"></line>
                        <line x1="23" y1="11" x2="17" y2="11"></line>
                    </svg>
                    <svg class="btn-spinner" viewBox="0 0 24 24" style="display: none;">
                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none" opacity="0.25"></circle>
                        <path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" stroke-width="4" fill="none">
                            <animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="1s" repeatCount="indefinite"></animateTransform>
                        </path>
                    </svg>
                </button>
            </form>

            <!-- Login Link -->
            <div class="auth-footer">
                <p>Already have an account? <a href="/login/">Sign in</a></p>
            </div>
        </div>

        <!-- Background Decoration -->
        <div class="bg-decoration">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
            <div class="circle circle-3"></div>
            <div class="circle circle-4"></div>
        </div>
    </div>

    <style>
        /* Auth Page Styles */
        .auth-page {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-size: 200% 200%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
            color: white;
            animation: fadeInDown 0.6s ease;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-header .logo {
            width: 4.5rem;
            height: 4.5rem;
            margin: 0 auto 1.25rem;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .auth-header .logo svg {
            width: 2.75rem;
            height: 2.75rem;
            stroke: white;
        }

        .auth-header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .auth-header p {
            font-size: 1rem;
            opacity: 0.95;
            font-weight: 400;
        }

        .auth-card {
            background: white;
            border-radius: 1.25rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            padding: 2.5rem;
            animation: fadeInUp 0.6s ease 0.2s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Floating Label Styles */
        .floating-label {
            position: relative;
        }

        .floating-label input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            border: 2px solid #e5e7eb;
            border-radius: 0.875rem;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
            color: #1f2937;
        }

        .floating-label input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .floating-label input:not(:placeholder-shown),
        .floating-label input:focus {
            padding-top: 1.5rem;
            padding-bottom: 0.5rem;
        }

        .floating-label label {
            position: absolute;
            left: 3rem;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            transition: all 0.3s ease;
            color: #6b7280;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .floating-label label svg {
            position: absolute;
            left: -3rem;
            width: 1.25rem;
            height: 1.25rem;
            color: #667eea;
            transition: color 0.3s ease;
        }

        .floating-label input:focus ~ label svg,
        .floating-label input:not(:placeholder-shown) ~ label svg {
            color: #667eea;
        }

        .floating-label input:not(:placeholder-shown) ~ label,
        .floating-label input:focus ~ label {
            top: 0.75rem;
            transform: translateY(0);
            font-size: 0.75rem;
            font-weight: 600;
            color: #667eea;
            left: 1rem;
        }

        .floating-label input:not(:placeholder-shown) ~ label svg,
        .floating-label input:focus ~ label svg {
            left: 0;
            top: 0.5rem;
            transform: none;
        }

        .floating-label input:not(:placeholder-shown) ~ label span,
        .floating-label input:focus ~ label span {
            margin-left: 1.25rem;
        }

        .field-border {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 2px;
            width: 0;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
            border-radius: 0 0 0.875rem 0.875rem;
        }

        .floating-label input:focus ~ .field-border {
            width: 100%;
        }

        .toggle-password {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
            color: #9ca3af;
            transition: all 0.2s ease;
            border-radius: 0.5rem;
        }

        .toggle-password:hover {
            color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        .toggle-password svg {
            width: 1.25rem;
            height: 1.25rem;
        }

        /* Form Hints */
        .form-hint {
            display: block;
            font-size: 0.75rem;
            color: #9ca3af;
            margin-top: 0.5rem;
            margin-left: 0.25rem;
        }

        /* Password Strength */
        .password-strength {
            margin-top: 0.75rem;
        }

        .strength-bar {
            height: 4px;
            background: #e5e7eb;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .strength-fill {
            height: 100%;
            width: 0%;
            background: #ef4444;
            transition: width 0.3s ease, background 0.3s ease;
            border-radius: 2px;
        }

        .strength-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .strength-text {
            font-size: 0.75rem;
            color: #9ca3af;
            transition: color 0.3s ease;
        }

        .strength-icon {
            font-size: 0.875rem;
            transition: all 0.3s ease;
        }

        /* Button Styles */
        .btn-large {
            padding: 1rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0.875rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-large::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-large:active::before {
            width: 300px;
            height: 300px;
        }

        .btn-block {
            width: 100%;
        }

        .btn-icon {
            width: 1.25rem;
            height: 1.25rem;
            transition: transform 0.3s ease;
        }

        .btn-large:hover .btn-icon {
            transform: scale(1.1);
        }

        .btn-spinner {
            width: 1.25rem;
            height: 1.25rem;
        }

        .btn.loading .btn-text,
        .btn.loading .btn-icon {
            display: none;
        }

        .btn.loading .btn-spinner {
            display: block;
        }

        /* Auth Footer */
        .auth-footer {
            text-align: center;
            margin-top: 1.75rem;
            padding-top: 1.75rem;
            border-top: 1px solid #e5e7eb;
        }

        .auth-footer p {
            color: #6b7280;
            font-size: 0.925rem;
        }

        .auth-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .auth-footer a:hover {
            color: #764ba2;
        }

        /* Messages */
        .messages {
            margin-bottom: 1rem;
        }

        .alert {
            display: flex;
            align-items: flex-start;
            gap: 0.625rem;
            padding: 1rem 1.125rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            margin-bottom: 0.75rem;
        }

        .alert:last-child {
            margin-bottom: 0;
        }

        .alert-animate {
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .alert-success {
            background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
            color: #065f46;
            border: 1px solid #6ee7b7;
        }

        .alert-error {
            background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
            color: #991b1b;
            border: 1px solid #fca5a5;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .alert-icon {
            width: 1.125rem;
            height: 1.125rem;
            flex-shrink: 0;
        }

        .alert-icon svg {
            width: 100%;
            height: 100%;
        }

        /* Background Decoration */
        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(40px);
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .circle-1 {
            width: 300px;
            height: 300px;
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }

        .circle-2 {
            width: 200px;
            height: 200px;
            bottom: -50px;
            left: -50px;
            animation-delay: 2s;
        }

        .circle-3 {
            width: 150px;
            height: 150px;
            top: 50%;
            left: -75px;
            animation-delay: 4s;
        }

        .circle-4 {
            width: 100px;
            height: 100px;
            top: 100px;
            right: 50px;
            animation-delay: 6s;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .auth-card {
                padding: 1.75rem;
            }

            .auth-header h1 {
                font-size: 1.5rem;
            }
        }
    </style>

    <script>
        // Form submission handler
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;
        });

        function togglePassword(inputId) {
            const passwordInput = document.getElementById(inputId);
            const container = passwordInput.parentElement;
            const eyeOpen = container.querySelector('.eye-open');
            const eyeClosed = container.querySelector('.eye-closed');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeOpen.style.display = 'none';
                eyeClosed.style.display = 'block';
            } else {
                passwordInput.type = 'password';
                eyeOpen.style.display = 'block';
                eyeClosed.style.display = 'none';
            }
        }

        function validateField(input) {
            if (input.value.length > 0) {
                input.parentElement.classList.add('has-value');
            } else {
                input.parentElement.classList.remove('has-value');
            }
        }

        function checkPasswordStrength() {
            const password = document.getElementById('password').value;
            const strengthFill = document.getElementById('strengthFill');
            const strengthText = document.getElementById('strengthText');
            const strengthIcon = document.getElementById('strengthIcon');

            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;

            const levels = ['Very Weak', 'Weak', 'Fair', 'Good', 'Strong'];
            const colors = ['#ef4444', '#f97316', '#eab308', '#84cc16', '#22c55e'];
            const widths = ['20%', '40%', '60%', '80%', '100%'];
            const icons = ['', '', '', '', '✓'];

            if (password.length === 0) {
                strengthFill.style.width = '0%';
                strengthText.textContent = 'Password strength';
                strengthText.style.color = '#9ca3af';
                strengthIcon.textContent = '';
            } else {
                const index = Math.min(strength, 4);
                strengthFill.style.width = widths[index];
                strengthFill.style.background = colors[index];
                strengthText.textContent = levels[index];
                strengthText.style.color = colors[index];
                strengthIcon.textContent = icons[index];
                strengthIcon.style.color = colors[index];
            }

            checkPasswordMatch();
        }

        function checkPasswordMatch() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const matchHint = document.getElementById('matchHint');

            if (confirmPassword.length === 0) {
                matchHint.textContent = '';
                return;
            }

            if (password === confirmPassword) {
                matchHint.textContent = '✓ Passwords match';
                matchHint.style.color = '#10b981';
            } else {
                matchHint.textContent = '✗ Passwords do not match';
                matchHint.style.color = '#ef4444';
            }
        }
    </script>
</body>
</html>
