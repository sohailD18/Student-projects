{% extends "tasks/base.html" %}

{% block page_title %}Calendar{% endblock %}

{% block content %}
<div class="calendar-container">
    <div class="card">
        <div class="card-body">
            <div style="text-align: center; padding: 4rem 2rem;">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" style="color: var(--gray-300); margin: 0 auto 1.5rem;">
                    <rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/>
                    <path d="M3 10h18M8 3v3M12 3v3M16 3v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <h3 style="color: var(--gray-600); margin-bottom: 0.5rem;">Calendar View Coming Soon</h3>
                <p style="color: var(--gray-500);">View your tasks on a calendar and manage your schedule visually</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
