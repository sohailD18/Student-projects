{% extends "tasks/base.html" %}

{% block page_title %}Tasks{% endblock %}

{% block content %}
<div class="tasks-container">
    <!-- Filters & Actions Bar -->
    <div class="card" style="margin-bottom: 1.5rem;">
        <div class="card-body" style="padding: 1rem 1.25rem;">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;">
                <!-- Search -->
                <div style="flex: 1; min-width: 250px;">
                    <input type="text" id="searchInput" class="form-input" placeholder="Search tasks..." style="padding: 0.625rem 0.875rem;">
                </div>

                <!-- Filters -->
                <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
                    <select id="statusFilter" class="form-select" style="padding: 0.625rem 0.875rem;">
                        <option value="">All Statuses</option>
                        <option value="todo">To Do</option>
                        <option value="in_progress">In Progress</option>
                        <option value="done">Done</option>
                    </select>

                    <select id="priorityFilter" class="form-select" style="padding: 0.625rem 0.875rem;">
                        <option value="">All Priorities</option>
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                        <option value="critical">Critical</option>
                    </select>

                    <select id="riskFilter" class="form-select" style="padding: 0.625rem 0.875rem;">
                        <option value="">All Risk Levels</option>
                        <option value="true">At Risk Only</option>
                    </select>

                    <select id="sortBy" class="form-select" style="padding: 0.625rem 0.875rem;">
                        <option value="-smart_priority_score">AI Priority (High to Low)</option>
                        <option value="smart_priority_score">AI Priority (Low to High)</option>
                        <option value="due_date">Due Date</option>
                        <option value="-due_date">Due Date (Reverse)</option>
                        <option value="-created_at">Newest First</option>
                        <option value="created_at">Oldest First</option>
                    </select>
                </div>

                <!-- Actions -->
                <div style="display: flex; gap: 0.75rem;">
                    <button class="btn btn-secondary" onclick="TasksView.refresh()">
                        <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
                            <path d="M4 2v1h2M4 2h16M4 2a2 2 0 00-2 2v2m18-4v1m0-1h-2m2 0a2 2 0 012 2v2M2 8h16M2 8a2 2 0 00-2 2v8a2 2 0 002 2h16a2 2 0 002-2v-8a2 2 0 00-2-2m0 0V6a2 2 0 00-2-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        Refresh
                    </button>
                    <button class="btn btn-primary" onclick="TasksView.showCreateModal()">
                        <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
                            <path d="M10 5v10M5 10h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        New Task
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Tasks Stats Bar -->
    <div style="display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap;">
        <div class="badge badge-gray" style="padding: 0.5rem 1rem; font-size: 0.875rem;">
            Total: <strong id="totalTasks">0</strong>
        </div>
        <div class="badge badge-primary" style="padding: 0.5rem 1rem; font-size: 0.875rem;">
            In Progress: <strong id="inProgressTasks">0</strong>
        </div>
        <div class="badge badge-warning" style="padding: 0.5rem 1rem; font-size: 0.875rem;">
            At Risk: <strong id="atRiskTasks">0</strong>
        </div>
    </div>

    <!-- Tasks List -->
    <div class="card">
        <div class="card-body" style="padding: 0;">
            <div id="tasksList" class="task-list" style="padding: 1rem;">
                <!-- Loading state -->
                <div class="skeleton" style="height: 100px; margin-bottom: 1rem;"></div>
                <div class="skeleton" style="height: 100px; margin-bottom: 1rem;"></div>
                <div class="skeleton" style="height: 100px;"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// Tasks View Controller
const TasksView = {
    tasks: [],
    filters: {
        search: '',
        status: '',
        priority: '',
        at_risk: '',
        sort: '-smart_priority_score',
    },

    async init() {
        this.bindEvents();
        await this.loadTasks();
    },

    bindEvents() {
        // Search input with debounce
        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                this.filters.search = e.target.value;
                this.loadTasks();
            }, 300);
        });

        // Filter selects
        document.getElementById('statusFilter').addEventListener('change', (e) => {
            this.filters.status = e.target.value;
            this.loadTasks();
        });

        document.getElementById('priorityFilter').addEventListener('change', (e) => {
            this.filters.priority = e.target.value;
            this.loadTasks();
        });

        document.getElementById('riskFilter').addEventListener('change', (e) => {
            this.filters.at_risk = e.target.value;
            this.loadTasks();
        });

        document.getElementById('sortBy').addEventListener('change', (e) => {
            this.filters.sort = e.target.value;
            this.loadTasks();
        });
    },

    async loadTasks() {
        try {
            const response = await API.tasks.list(this.filters);
            this.tasks = response.tasks;
            this.renderTasks();
            this.updateStats();
        } catch (error) {
            console.error('Error loading tasks:', error);
            Toast.error('Failed to load tasks');
        }
    },

    renderTasks() {
        const tasksList = document.getElementById('tasksList');

        if (this.tasks.length === 0) {
            tasksList.innerHTML = `
                <div style="text-align: center; padding: 3rem;">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" style="color: var(--gray-300); margin-bottom: 1rem;">
                        <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <h3 style="color: var(--gray-600); margin-bottom: 0.5rem;">No tasks found</h3>
                    <p style="color: var(--gray-500);">Try adjusting your filters or create a new task</p>
                </div>
            `;
            return;
        }

        tasksList.innerHTML = this.tasks.map(task => this.renderTaskCard(task)).join('');
    },

    renderTaskCard(task) {
        const riskClass = task.is_at_risk ? 'at-risk' : '';
        const overdueClass = task.is_overdue ? 'overdue' : '';
        const scoreClass = task.smart_priority_score >= 70 ? 'score-high' :
                          task.smart_priority_score >= 40 ? 'score-medium' : 'score-low';

        return `
            <div class="task-card ${riskClass} ${overdueClass}" data-task-id="${task.id}">
                <div class="task-header">
                    <div style="flex: 1; min-width: 0;">
                        <div class="task-title">${task.title}</div>
                        <div class="task-meta">
                            ${task.assignee ? `<span>Assigned to: ${task.assignee.username}</span>` : '<span>Unassigned</span>'}
                            ${task.project ? `<span>• ${task.project.name}</span>` : ''}
                            ${task.category ? `<span>• ${task.category.name}</span>` : ''}
                        </div>
                        ${task.description ? `<div style="font-size: 0.875rem; color: var(--gray-600); margin-top: 0.5rem; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">${task.description}</div>` : ''}
                    </div>
                    <div style="display: flex; align-items: center; gap: 0.75rem;">
                        <div class="task-priority-score">
                            <span style="font-size: 0.75rem; color: var(--gray-500);">AI Score</span>
                            <div class="score-badge ${scoreClass}">${task.smart_priority_score}</div>
                        </div>
                        <div class="dropdown" style="position: relative;">
                            <button class="btn-icon" onclick="event.stopPropagation(); TasksView.showTaskMenu(${task.id})" style="width: 32px; height: 32px;">
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                                    <circle cx="8" cy="3" r="1.5" fill="currentColor"/>
                                    <circle cx="8" cy="8" r="1.5" fill="currentColor"/>
                                    <circle cx="8" cy="13" r="1.5" fill="currentColor"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="task-footer" style="display: flex; align-items: center; gap: 1rem; margin-top: 0.75rem; flex-wrap: wrap;">
                    ${StatusHelper.getBadge(task.status_code, task.status)}
                    ${PriorityHelper.getBadge(task.priority_code, task.priority)}
                    ${task.is_at_risk ? RiskHelper.getIndicator(task.risk_level_code, task.risk_level) : ''}
                    ${task.due_date ? `<span style="font-size: 0.75rem; color: var(--gray-500); margin-left: auto; display: flex; align-items: center; gap: 0.25rem;">
                        <svg width="14" height="14" viewBox="0 0 20 20" fill="none">
                            <path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        ${Format.timeUntil(task.due_date)}
                    </span>` : ''}
                    ${task.estimated_hours ? `<span style="font-size: 0.75rem; color: var(--gray-500); display: flex; align-items: center; gap: 0.25rem;">
                        <svg width="14" height="14" viewBox="0 0 20 20" fill="none">
                            <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Est: ${task.estimated_hours}h
                    </span>` : ''}
                </div>
                ${task.tags && task.tags.length > 0 ? `
                    <div style="display: flex; gap: 0.5rem; margin-top: 0.75rem; flex-wrap: wrap;">
                        ${task.tags.map(tag => `<span class="badge" style="background: ${tag.color}; color: white;">${tag.name}</span>`).join('')}
                    </div>
                ` : ''}
                ${task.blocked_by_count > 0 ? `
                    <div style="margin-top: 0.75rem; font-size: 0.75rem; color: var(--warning-600); display: flex; align-items: center; gap: 0.25rem;">
                        <svg width="14" height="14" viewBox="0 0 20 20" fill="none">
                            <path d="M12 15v2m-6 0v2m8-10v2m-6 0v2M5 21h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Blocked by ${task.blocked_by_count} task${task.blocked_by_count > 1 ? 's' : ''}
                    </div>
                ` : ''}
                ${task.blocking_count > 0 ? `
                    <div style="margin-top: 0.5rem; font-size: 0.75rem; color: var(--info-600); display: flex; align-items: center; gap: 0.25rem;">
                        <svg width="14" height="14" viewBox="0 0 20 20" fill="none">
                            <path d="M13 10V3L4 14h7v7l9-11h-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Blocking ${task.blocking_count} task${task.blocking_count > 1 ? 's' : ''}
                    </div>
                ` : ''}
            </div>
        `;
    },

    updateStats() {
        const total = this.tasks.length;
        const inProgress = this.tasks.filter(t => t.status_code === 'in_progress').length;
        const atRisk = this.tasks.filter(t => t.is_at_risk).length;

        document.getElementById('totalTasks').textContent = total;
        document.getElementById('inProgressTasks').textContent = inProgress;
        document.getElementById('atRiskTasks').textContent = atRisk;
    },

    showTaskMenu(taskId) {
        const task = this.tasks.find(t => t.id === taskId);
        if (!task) return;

        const menuHtml = `
            <div style="display: flex; flex-direction: column; gap: 0.25rem;">
                <button class="btn btn-secondary" style="justify-content: flex-start;" onclick="TasksView.quickStatusUpdate(${taskId}, 'todo')">
                    Mark as To Do
                </button>
                <button class="btn btn-secondary" style="justify-content: flex-start;" onclick="TasksView.quickStatusUpdate(${taskId}, 'in_progress')">
                    Mark as In Progress
                </button>
                <button class="btn btn-secondary" style="justify-content: flex-start;" onclick="TasksView.quickStatusUpdate(${taskId}, 'done')">
                    Mark as Done
                </button>
                <div style="border-top: 1px solid var(--gray-200); margin: 0.25rem 0;"></div>
                <button class="btn btn-secondary" style="justify-content: flex-start;" onclick="window.location.href='/tasks/${taskId}/'">
                    View Details
                </button>
                <button class="btn btn-danger" style="justify-content: flex-start;" onclick="TasksView.deleteTask(${taskId})">
                    Delete Task
                </button>
            </div>
        `;

        Modal.show('Task Actions', menuHtml);
    },

    async quickStatusUpdate(taskId, status) {
        try {
            Modal.hide();
            await API.tasks.update(taskId, { status });
            Toast.success('Task status updated');
            await this.loadTasks();
        } catch (error) {
            Toast.error('Failed to update task status');
        }
    },

    async deleteTask(taskId) {
        if (!confirm('Are you sure you want to delete this task?')) return;

        try {
            Modal.hide();
            await API.tasks.delete(taskId);
            Toast.success('Task deleted');
            await this.loadTasks();
        } catch (error) {
            Toast.error('Failed to delete task');
        }
    },

    showCreateModal() {
        const formHtml = `
            <form id="createTaskForm" onsubmit="event.preventDefault(); TasksView.createTask();">
                <div class="form-group">
                    <label class="form-label">Title *</label>
                    <input type="text" name="title" class="form-input" required placeholder="Enter task title">
                </div>
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-textarea" placeholder="Enter task description"></textarea>
                </div>
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label">Priority</label>
                        <select name="priority" class="form-select">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                            <option value="critical">Critical</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Due Date</label>
                        <input type="datetime-local" name="due_date" class="form-input">
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label">Estimated Hours</label>
                        <input type="number" name="estimated_hours" class="form-input" step="0.5" min="0" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Assignee</label>
                        <select name="assignee" class="form-select">
                            <option value="">Unassigned</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="Modal.hide()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create Task</button>
                </div>
            </form>
        `;

        Modal.show('Create New Task', formHtml);
        this.loadAssignees();
    },

    async loadAssignees() {
        try {
            const response = await API.users.list();
            const select = document.querySelector('#createTaskForm select[name="assignee"]');
            select.innerHTML = '<option value="">Unassigned</option>' +
                response.users.map(user => `<option value="${user.id}">${user.username}</option>`).join('');
        } catch (error) {
            console.error('Error loading users:', error);
        }
    },

    async createTask() {
        const form = document.getElementById('createTaskForm');
        const formData = new FormData(form);

        const taskData = {
            title: formData.get('title'),
            description: formData.get('description'),
            priority: formData.get('priority'),
            due_date: formData.get('due_date') || null,
            estimated_hours: parseFloat(formData.get('estimated_hours')) || null,
            assignee: formData.get('assignee') || null,
        };

        try {
            await API.tasks.create(taskData);
            Modal.hide();
            Toast.success('Task created successfully');
            await this.loadTasks();
        } catch (error) {
            Toast.error('Failed to create task: ' + error.message);
        }
    },

    async refresh() {
        await this.loadTasks();
        Toast.success('Tasks refreshed');
    }
};

// Initialize tasks view
document.addEventListener('DOMContentLoaded', () => {
    TasksView.init();
});
</script>
{% endblock %}
