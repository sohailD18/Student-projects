{% extends "base.html" %}

{% block title %}Home - Fraud Detection System{% endblock %}

{% block content %}
<div class="text-center" style="padding: 4rem 0;">
    <div style="max-width: 600px; margin: 0 auto;">
        <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color: var(--primary-light); margin-bottom: 2rem;">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="M9 12l2 2 4-4"/>
        </svg>

        <h1 style="font-size: 3rem; margin-bottom: 1rem; color: var(--text-primary);">AI-Powered Fraud Detection</h1>
        <p style="font-size: 1.25rem; color: var(--text-muted); margin-bottom: 3rem;">
            Advanced machine learning system for real-time financial transaction fraud detection and analysis.
        </p>

        <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
            <a href="/" class="btn btn-primary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"/>
                    <rect x="14" y="3" width="7" height="7"/>
                    <rect x="14" y="14" width="7" height="7"/>
                    <rect x="3" y="14" width="7" height="7"/>
                </svg>
                View Dashboard
            </a>
            <a href="/transactions/" class="btn btn-outline">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="8" y1="6" x2="21" y2="6"/>
                    <line x1="8" y1="12" x2="21" y2="12"/>
                    <line x1="8" y1="18" x2="21" y2="18"/>
                    <line x1="3" y1="6" x2="3.01" y2="6"/>
                    <line x1="3" y1="12" x2="3.01" y2="12"/>
                    <line x1="3" y1="18" x2="3.01" y2="18"/>
                </svg>
                Browse Transactions
            </a>
        </div>
    </div>
</div>
{% endblock %}
